name: Build PS4 PRX Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Make
        run: |
          # Компилируем напрямую как разделяемую библиотеку под ELF/PS4
          gcc -O3 -Wall -fPIC -shared -nostdlib -o isaac_trainer.prx main.cpp || g++ -O3 -Wall -fPIC -shared -nostdlib -o isaac_trainer.prx main.cpp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isaac_trainer_prx
          path: isaac_trainer.prx
