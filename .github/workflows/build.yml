name: Build PS4 PRX Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Build
        run: |
          # Клонируем заголовки и тулчейн OpenOrbis
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/toolchain
          
          # Компилируем main.cpp с указанием путей к заголовочным файлам OpenOrbis
          g++ -O3 -Wall -fPIC -shared \
            -I/tmp/toolchain/include \
            -I/tmp/toolchain/include/orbis \
            main.cpp -o isaac_trainer.prx || true

          # Проверим, собрался ли файл
          ls -la isaac_trainer.prx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isaac_trainer_prx
          path: isaac_trainer.prx
