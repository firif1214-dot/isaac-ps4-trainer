name: Build PS4 PRX Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OpenOrbis Toolchain
        run: |
          echo "=== 1. Клонирование тулчейна OpenOrbis ==="
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/openorbis
          
          if [ ! -d "/opt/openorbis" ]; then
            echo "::error::Не удалось клонировать тулчейн OpenOrbis!"
            exit 1
          fi

          echo "OO_PS4_TOOLCHAIN=/opt/openorbis" >> $GITHUB_ENV
          echo "/opt/openorbis/bin" >> $GITHUB_PATH

          echo "=== 2. Строгая проверка компилятора ==="
          if [ -f "/opt/openorbis/bin/oo-clang++" ]; then
            chmod +x /opt/openorbis/bin/oo-clang++
            echo "Компилятор найден!"
            /opt/openorbis/bin/oo-clang++ --version
          else
            echo "::error::Критическая ошибка: oo-clang++ не найден в тулчейне!"
            exit 1
          fi

      - name: Compile PRX Plugin
        run: |
          echo "=== 3. Запуск компиляции через oo-clang++ ==="
          export OO_PS4_TOOLCHAIN=/opt/openorbis
          
          # Собираем напрямую через обертку OpenOrbis, гарантируя правильные ключи для PRX
          /opt/openorbis/bin/oo-clang++ -O3 -Wall -fPIC -shared main.cpp -o isaac_trainer.prx
          
          if [ $? -ne 0 ]; then
            echo "::error::Компиляция завершилась с ошибкой!"
            exit 1
          fi

      - name: Verify Artifact Existence
        run: |
          echo "=== 4. Проверка готового файла ==="
          if [ -f "isaac_trainer.prx" ]; then
            echo "Файл isaac_trainer.prx успешно создан!"
            ls -lh isaac_trainer.prx
          else
            echo "::error::Файл isaac_trainer.prx отсутствует!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isaac_trainer_prx
          path: isaac_trainer.prx
