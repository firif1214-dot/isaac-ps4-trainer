name: Build PS4 PRX Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Build
        run: |
          # Клонируем тулчейн OpenOrbis
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/toolchain
          
          # Компилируем с правильным путем к заголовкам из папки include тулчейна
          g++ -O3 -Wall -fPIC -shared \
            -I/tmp/toolchain/include \
            main.cpp -o isaac_trainer.prx

          ls -la isaac_trainer.prx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: isaac_trainer_prx
          path: isaac_trainer.prx
